<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AR Mesh Viewer</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="app">
		<header class="app-header">
			<h1>AR Mesh Viewer</h1>
			<p>Pick a category, snap a photo, view the model in AR.</p>
		</header>

		<section class="form-section">
			<label for="category">Category</label>
			<select id="category">
				<option value="bed">Bed</option>
				<option value="bookcase">Bookcase</option>
				<option value="desk">Desk</option>
				<option value="misc">Misc</option>
				<option value="sofa">Sofa</option>
				<option value="table">Table</option>
				<option value="tool">Tool</option>
				<option value="wardrobe">Wardrobe</option>
			</select>

			<label>Photo</label>
			<button id="camera-btn" type="button">Take Photo</button>

			<video id="camera-video" playsinline autoplay hidden></video>
			<canvas id="camera-canvas" hidden></canvas>

			<button id="capture-btn" type="button" hidden>Capture</button>

			<div id="preview-section" hidden>
				<img id="preview-img" alt="captured photo">
				<button id="retake-btn" type="button">Retake</button>
			</div>

			<button id="submit-btn" type="button">Generate Model</button>
		</section>

		<section id="status-section" class="status-section" hidden>
			<p id="status-text"></p>
		</section>

		<section id="result-section" class="result-section" hidden>
			<a id="ar-link" rel="ar" href="#">
				<img src="https://developer.apple.com/assets/elements/icons/ar-quick-look/ar-quick-look-96x96_2x.png" alt="">
				View in AR
			</a>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
